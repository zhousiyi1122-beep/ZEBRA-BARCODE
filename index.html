<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Zebra 條碼顯示器</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 16px 28px; background: #f4f6f8;
    color: #17202a; font-family: Arial, "Noto Sans TC", sans-serif;
  }
  main { max-width: 620px; margin: 0 auto; }
  h1 { font-size: 23px; margin: 4px 0 6px; }
  .sub { color: #5d6873; font-size: 14px; margin: 0 0 20px; }
  .panel {
    background: white; border-radius: 16px; padding: 18px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
  }
  label { display:block; font-weight:700; margin-bottom:8px; }
  input {
    width:100%; font-size:26px; padding:13px 14px; border:2px solid #cbd3da;
    border-radius:10px; outline:none; letter-spacing:1px;
  }
  input:focus { border-color:#1769aa; }
  .buttons { display:flex; gap:10px; margin-top:12px; }
  button {
    flex:1; border:0; border-radius:10px; padding:13px 10px;
    font-size:16px; font-weight:700; background:#1769aa; color:white;
  }
  button.secondary { background:#e8edf2; color:#17202a; }
  .barcode-wrap {
    background:white; margin-top:18px; padding:22px 10px 16px;
    border-radius:14px; text-align:center; overflow:hidden;
  }
  canvas { display:block; width:100%; height:auto; image-rendering:pixelated; }
  #shown { font-size:28px; font-weight:700; letter-spacing:2px; margin-top:8px; }
  #status { min-height:20px; color:#b42318; font-size:13px; margin-top:8px; }
  .tip { color:#59636e; font-size:13px; line-height:1.55; margin:14px 2px 0; }
  .small { color:#6b7280; font-size:12px; text-align:center; margin-top:13px; }
</style>
</head>
<body>
<main>
  <h1>Zebra 條碼顯示器</h1>
  <p class="sub">輸入新數字，條碼會立即更新。可離線使用。</p>
  <section class="panel">
    <label for="code">條碼內容</label>
    <input id="code" type="text" inputmode="text" autocomplete="off" spellcheck="false" value="24" placeholder="例如：24 或 ABC123">
    <div class="buttons">
      <button id="generate" type="button">更新條碼</button>
      <button id="save" class="secondary" type="button">儲存條碼圖片</button>
    </div>
    <div id="status" role="status"></div>
    <div class="barcode-wrap">
      <canvas id="barcode" width="1000" height="300" aria-label="條碼"></canvas>
      <div id="shown">24</div>
    </div>
    <p class="tip">掃描時請把手機螢幕亮度調高，讓 Zebra 掃描器對準條碼中央。若掃描器無法讀取，可能需要在掃描器設定中啟用 LCD／手機螢幕掃描模式。</p>
  </section>
  <p class="small">Code 128 · 條碼在手機本機產生，不會上傳資料</p>
</main>
<script>
(() => {
  // Standard Code 128 bar/space width patterns, codewords 0–106.
  const P = [
    "212222","222122","222221","121223","121322","131222","122213","122312","132212","221213",
    "221312","231212","112232","122132","122231","113222","123122","123221","223211","221132",
    "221231","213212","223112","312131","311222","321122","321221","312212","322112","322211",
    "212123","212321","232121","111323","131123","131321","112313","132113","132311","211313",
    "231113","231311","112133","112331","132131","113123","113321","133121","313121","211331",
    "231131","213113","213311","213131","311123","311321","331121","312113","312311","332111",
    "314111","221411","431111","111224","111422","121124","121421","141122","141221","112214",
    "112412","122114","122411","142112","142211","241211","221114","413111","241112","134111",
    "111242","121142","121241","114212","124112","124211","411212","421112","421211","212141",
    "214121","412121","111143","111341","131141","114113","114311","411113","411311","113141",
    "114131","311141","411131","211412","211214","211232","2331112"
  ];

  const input = document.getElementById('code');
  const canvas = document.getElementById('barcode');
  const ctx = canvas.getContext('2d');
  const shown = document.getElementById('shown');
  const status = document.getElementById('status');

  function code128B(text) {
    const chars = Array.from(text);
    const values = chars.map(ch => {
      const n = ch.charCodeAt(0);
      if (n < 32 || n > 126) throw new Error('請使用英文字母、數字及一般鍵盤符號（ASCII 32–126）。');
      return n - 32;
    });
    const words = [104, ...values];
    let checksum = 104;
    for (let i = 0; i < values.length; i++) checksum += values[i] * (i + 1);
    words.push(checksum % 103, 106);
    return words;
  }

  function draw() {
    const text = input.value.trim();
    status.textContent = '';
    if (!text) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      shown.textContent = '';
      status.textContent = '請先輸入條碼內容。';
      return false;
    }
    try {
      const words = code128B(text);
      const quiet = 70, module = 3, top = 35, barHeight = 190;
      const totalModules = words.reduce((sum, w) => {
        return sum + P[w].split('').reduce((a, b) => a + Number(b), 0);
      }, 0);
      const needed = quiet * 2 + totalModules * module;
      canvas.width = Math.max(1000, needed);
      canvas.height = 300;
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      let x = Math.round((canvas.width - (totalModules * module)) / 2);
      ctx.fillStyle = '#000';
      for (const w of words) {
        const pattern = P[w];
        for (let i = 0; i < pattern.length; i++) {
          const width = Number(pattern[i]) * module;
          if (i % 2 === 0) ctx.fillRect(x, top, width, barHeight);
          x += width;
        }
      }
      shown.textContent = text;
      return true;
    } catch (e) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      shown.textContent = '';
      status.textContent = e.message;
      return false;
    }
  }

  document.getElementById('generate').addEventListener('click', draw);
  input.addEventListener('input', draw);
  document.getElementById('save').addEventListener('click', () => {
    if (!draw()) return;
    const link = document.createElement('a');
    link.download = 'Zebra-barcode-' + input.value.trim().replace(/[^a-zA-Z0-9_-]/g, '_') + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
  draw();
})();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
</body>
</html>
