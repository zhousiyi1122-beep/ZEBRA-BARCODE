<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Zebra Barcode Display</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: #0f172a;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 20px;
      padding: 20px 18px;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.08);
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: fit-content;
    }

    .header {
      text-align: center;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 13px;
      color: #64748b;
      line-height: 1.4;
    }

    .mode-toggle {
      display: flex;
      background: #e2e8f0;
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }

    .mode-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 10px 8px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .mode-btn.active {
      background: #ffffff;
      color: #0f172a;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .card {
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 14px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-label {
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
      display: block;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .barcode-input {
      flex: 1;
      min-width: 0;
      height: 44px;
      padding: 0 12px;
      font-size: 17px;
      font-weight: 600;
      color: #0f172a;
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .barcode-input:focus {
      border-color: #0f172a;
      background: #ffffff;
    }

    .clear-btn {
      flex-shrink: 0;
      height: 44px;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      cursor: pointer;
    }

    .clear-btn:active {
      background: #e2e8f0;
    }

    .barcode-box {
      width: 100%;
      min-height: 126px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 10px;
      overflow: hidden;
    }

    .barcode-canvas {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .placeholder-text {
      font-size: 13px;
      color: #94a3b8;
      text-align: center;
      padding: 20px 10px;
    }

    .save-btn {
      width: 100%;
      height: 46px;
      background: #0f172a;
      color: #ffffff;
      border: none;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
    }

    .save-btn:active {
      background: #1e293b;
    }

    .hidden {
      display: none !important;
    }

    .footer-note {
      font-size: 12px;
      color: #64748b;
      text-align: center;
      line-height: 1.45;
      padding: 0 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Zebra Barcode Display</h1>
      <p>Enter a number or text. The barcode updates automatically.</p>
    </div>

    <div class="mode-toggle">
      <button type="button" id="btnSingle" class="mode-btn active" onclick="setMode('single')">1 Barcode</button>
      <button type="button" id="btnDual" class="mode-btn" onclick="setMode('dual')">2 Barcodes</button>
    </div>

    <!-- Card 1 -->
    <div class="card">
      <div>
        <label id="label1" class="input-label" for="input1">Barcode Content</label>
        <div class="input-row">
          <input type="text" id="input1" class="barcode-input" value="24" placeholder="Enter text or numbers..." autocomplete="off" />
          <button type="button" class="clear-btn" onclick="clearField(1)">Clear</button>
        </div>
      </div>

      <div class="barcode-box">
        <canvas id="canvas1" class="barcode-canvas"></canvas>
        <div id="placeholder1" class="placeholder-text hidden">Enter content above to generate barcode</div>
      </div>

      <button type="button" id="saveBtn1" class="save-btn" onclick="saveBarcode(1)">SAVE BARCODE IMAGE</button>
    </div>

    <!-- Card 2 (Dual mode only) -->
    <div id="card2" class="card hidden">
      <div>
        <label class="input-label" for="input2">Barcode 2 Content</label>
        <div class="input-row">
          <input type="text" id="input2" class="barcode-input" value="" placeholder="Enter second barcode..." autocomplete="off" />
          <button type="button" class="clear-btn" onclick="clearField(2)">Clear</button>
        </div>
      </div>

      <div class="barcode-box">
        <canvas id="canvas2" class="barcode-canvas hidden"></canvas>
        <div id="placeholder2" class="placeholder-text">Enter content above to generate barcode</div>
      </div>
    </div>

    <p class="footer-note">
      For scanning, increase your phone screen brightness and point the Zebra scanner at the centre of the barcode.
    </p>
  </div>

  <script>
    // Standard Code 128 patterns (values 0 to 106)
    const CODE128_PATTERNS = [
      "11011001100", "11001101100", "11001100110", "10010011000", "10010001100",
      "10001001100", "10011001000", "10011000100", "10001100100", "11001001000",
      "11001000100", "11000100100", "10110011100", "10011011100", "10011001110",
      "10111001100", "10011101100", "10011100110", "11001110010", "11001011100",
      "11001001110", "11011100100", "11001110100", "11101101110", "11101001100",
      "11100101100", "11100100110", "11101100100", "11100110100", "11100110010",
      "11011011000", "11011000110", "11000110110", "10100011000", "10001011000",
      "10001000110", "10110001000", "10001101000", "10001100010", "11010001000",
      "11000101000", "11000100010", "10110111000", "10110001110", "10001101110",
      "10111011000", "10111000110", "10001110110", "11101110110", "11010001110",
      "11000101110", "11011101000", "11011100010", "11011101110", "11101011000",
      "11101000110", "11100010110", "11101101000", "11101100010", "11100011010",
      "11101111010", "11001000010", "11110001010", "10100110000", "10100001100",
      "10010110000", "10010000110", "10000101100", "10000100110", "10110010000",
      "10110000100", "10011010000", "10011000010", "10000110100", "10000110010",
      "11000010010", "11001010000", "11110111010", "11000010100", "10001111010",
      "10100111100", "10010111100", "10010011110", "10111100100", "10011110100",
      "10011110010", "11110100100", "11110010100", "11110010010", "11011011110",
      "11011110110", "11110110110", "10101111000", "10100011110", "10001011110",
      "10111101000", "10111100010", "11110101000", "11110100010", "10111011110",
      "10111101110", "11101011110", "11110101110", "11010000100", "11010010000",
      "11010011100", "1100011101011"
    ];

    // Encode strictly using Code 128B (Start B = 104) for finer, individual-character bars
    function encodeCode128B(text) {
      if (!text || text.length === 0) return null;
      const START_B = 104;
      const STOP = 106;
      const values = [START_B];

      for (let i = 0; i < text.length; i++) {
        const code = text.charCodeAt(i);
        // Printable ASCII 32..126 maps directly to Code 128B values 0..94
        if (code < 32 || code > 126) {
          continue;
        }
        values.push(code - 32);
      }

      if (values.length === 1) return null;

      let checksum = values[0];
      for (let i = 1; i < values.length; i++) {
        checksum += values[i] * i;
      }
      values.push(checksum % 103);
      values.push(STOP);

      return values.map(v => CODE128_PATTERNS[v]).join("");
    }

    function renderBarcode(index) {
      const input = document.getElementById("input" + index);
      const canvas = document.getElementById("canvas" + index);
      const placeholder = document.getElementById("placeholder" + index);
      const text = input.value;

      const bitString = encodeCode128B(text);
      if (!bitString) {
        canvas.classList.add("hidden");
        placeholder.classList.remove("hidden");
        return;
      }

      canvas.classList.remove("hidden");
      placeholder.classList.add("hidden");

      const ctx = canvas.getContext("2d");
      const moduleWidth = 3; // crisp fine bar width
      const quietZone = 12 * moduleWidth; // generous white quiet zone for Zebra MC3300
      const barHeight = 96;
      const textHeight = 28;
      const topPadding = 8;

      const totalWidth = bitString.length * moduleWidth + quietZone * 2;
      const totalHeight = topPadding + barHeight + textHeight;

      canvas.width = totalWidth;
      canvas.height = totalHeight;

      // Pure white background
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, totalWidth, totalHeight);

      // Draw black bars
      ctx.fillStyle = "#000000";
      for (let i = 0; i < bitString.length; i++) {
        if (bitString[i] === "1") {
          ctx.fillRect(quietZone + i * moduleWidth, topPadding, moduleWidth, barHeight);
        }
      }

      // Draw human-readable text below bars
      ctx.font = "bold 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      ctx.fillText(text, totalWidth / 2, topPadding + barHeight + 5);
    }

    function setMode(mode) {
      const btnSingle = document.getElementById("btnSingle");
      const btnDual = document.getElementById("btnDual");
      const card2 = document.getElementById("card2");
      const label1 = document.getElementById("label1");
      const saveBtn1 = document.getElementById("saveBtn1");

      if (mode === "single") {
        btnSingle.classList.add("active");
        btnDual.classList.remove("active");
        card2.classList.add("hidden");
        label1.textContent = "Barcode Content";
        saveBtn1.classList.remove("hidden");
      } else {
        btnDual.classList.add("active");
        btnSingle.classList.remove("active");
        card2.classList.remove("hidden");
        label1.textContent = "Barcode 1 Content";
        saveBtn1.classList.add("hidden");
        renderBarcode(2);
      }
      renderBarcode(1);
    }

    function clearField(index) {
      const input = document.getElementById("input" + index);
      input.value = "";
      input.focus();
      renderBarcode(index);
    }

    function saveBarcode(index) {
      const input = document.getElementById("input" + index);
      const canvas = document.getElementById("canvas" + index);
      if (!input.value.trim()) return;

      const link = document.createElement("a");
      const safeName = input.value.trim().replace(/[^a-zA-Z0-9_-]/g, "_");
      link.download = "barcode_" + safeName + ".png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    document.getElementById("input1").addEventListener("input", () => renderBarcode(1));
    document.getElementById("input2").addEventListener("input", () => renderBarcode(2));

    // Initial render
    renderBarcode(1);
  </script>
</body>
</html>
